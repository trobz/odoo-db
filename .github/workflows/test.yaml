name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: make test

  # The `tests` job above runs against the locked dependency set (uv sync
  # --frozen). That never exercises the entry point installed from freshly
  # resolved dependencies — the `uv tool install` / `pip install` path users
  # actually deploy — so a dependency that ships a breaking change (e.g. a new
  # Typer that vendors its own click and drops the standalone `click` dep, or a
  # click that changes its option-parsing internals) slips through green CI and
  # only blows up on install. This job installs the package like a user would,
  # across both the newest and the floor-pinned dependency versions, and runs
  # the CLI construction/parse guards against it.
  cli-resolved:
    name: CLI on ${{ matrix.resolution }} deps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        resolution: [highest, lowest-direct]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install the package with ${{ matrix.resolution }} dependency resolution
        run: |
          uv venv --python 3.12 /tmp/cli
          uv pip install --python /tmp/cli/bin/python --resolution ${{ matrix.resolution }} .
          uv pip install --python /tmp/cli/bin/python pytest

      - name: Show resolved runtime deps
        run: |
          /tmp/cli/bin/python - <<'EOF'
          import importlib.metadata as m
          for p in ("typer", "click", "rich", "psycopg"):
              try:
                  print(p, m.version(p))
              except m.PackageNotFoundError:
                  print(p, "absent")
          EOF

      - name: Entry point runs (import + command build)
        run: /tmp/cli/bin/odoo-db --help

      - name: CLI construction/parse guards under resolved deps
        run: /tmp/cli/bin/pytest tests/test_smoke.py -q --import-mode=importlib -k "help or users_options_parse"

  # `cli-resolved` covers the dependency/install surface; this covers the
  # data-shape surface. It loads the synthetic per-version fixtures
  # (tests/fixtures/versions/) into a throwaway PostgreSQL and asserts odoo-db's
  # version-shape probes and the shape-sensitive commands agree with each
  # version's manifest entry. The fixtures are tiny in-process SQL loads, so
  # this is a single job rather than a per-version matrix (a matrix would spin
  # up seven postgres services to each run one seventh of the suite); if real
  # neutralized dumps replace the synthetic SQL later, this becomes the matrix
  # the spec describes. See tests/fixtures/versions/README.md.
  version-fixtures:
    name: Version fixtures
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Run version-fixture shape tests
        run: uv run python -m pytest tests/test_fixtures.py -q
